name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    # Docker-free: proves config resolution and that every module loads, on both platforms.
    # The full benchmark needs Linux containers, which hosted Windows runners cannot provide,
    # so the Windows path is exercised here and proven for real on a developer machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: every module imports
        run: node --input-type=module -e "await Promise.all(['./src/paths.js','./src/setup.js','./src/helper.js','./src/exporter.js'].map(m => import(m)))"
